<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Overload</title>
  <meta name="description" content="Workout generator and lifting log. Runs in your browser, data stays on your device.">
  <meta name="theme-color" content="#1c1f24">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Overload">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Big+Shoulders:opsz,wght@10..72,700..800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view" tabindex="-1"></main>
  <div id="dock"></div>
  <nav id="tabs" aria-label="Main">
    <a href="#/" data-tab="workout">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      <span>Workout</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4h4M12 7.5V12l3 2"/></svg>
      <span>History</span>
    </a>
    <a href="#/exercises" data-tab="exercises">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h3.5v15H5zM10.5 4.5H14v15h-3.5zM16 5.3l3.3-.8 3 14.6-3.3.8z"/></svg>
      <span>Exercises</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span>Settings</span>
    </a>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript>Overload needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
